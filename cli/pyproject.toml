[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shelfmark-dl"
version = "0.1.0"
description = "Search a Shelfmark node and optionally queue a download."
requires-python = ">=3.9"
dependencies = ["shelfmark-client"]

[project.scripts]
shelfmark-dl = "shelfmark_dl.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["shelfmark_dl"]

[tool.uv.sources]
shelfmark-client = { path = "../generated/python" }
